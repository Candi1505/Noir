name: Onyx privacy audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  private-artifact-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject private captures and credentials
        run: node test-private-artifact-gate.cjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -not -path './.git/*' -print0)
