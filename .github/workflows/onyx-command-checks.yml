name: Onyx Command checks

on:
  pull_request:
  push:
    branches:
      - main
      - codex/onyx-command-foundation

permissions:
  contents: read

jobs:
  application-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find . -maxdepth 2 -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Run automatic regression tests
        shell: bash
        run: |
          for test_file in test-*.cjs; do
            if grep -q 'process\.argv' "$test_file"; then
              echo "SKIP $test_file — private fixture input required"
              continue
            fi
            echo "RUN $test_file"
            node "$test_file"
          done

      - name: Reject private capture files
        shell: bash
        run: |
          if find . -type f \( -iname '*.har' -o -iname '*.har.zip' -o -iname '*.pcap' -o -iname '*.pcapng' \) | grep -q .; then
            echo 'Private capture material must never be committed.'
            exit 1
          fi
